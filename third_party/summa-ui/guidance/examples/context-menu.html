<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context menu preset</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/presets.css">
<style>
  /* Page chrome only. Components use sm- classes from presets.css. */
  body { margin: 0; background: var(--s0); color: var(--text); font: 400 var(--fs)/1.5 var(--font); }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 96px; display: flex; flex-direction: column; gap: 28px; }
  h1 { margin: 0; font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.01em; }
  main > section > h2 { margin: 0 0 8px; font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3); }
  p { margin: 0; color: var(--text-2); }
  .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .panel { background: var(--s1); border-radius: var(--r-lg); padding: 8px; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Context menu</h1>
    <p>Right click, long press or Shift+F10 opens the actions for the thing under the pointer. Never the only way to reach an action.</p>
  </div>

  <section>
    <h2>Right click, long press, or press Shift+F10 / the Menu key on the focused area</h2>
    <div class="sm-context-area" id="area" tabindex="0" role="group" aria-label="Project card. Press Shift+F10 for actions.">Project "Atlas"<br>Right click here</div>
  </section>
  <section>
    <h2>Static anatomy</h2>
    <div class="sm-menu" role="menu" aria-label="Anatomy" style="width:240px">
      <div class="sm-menu__heading">Project</div>
      <button class="sm-menu__item" role="menuitem"><svg class="sm-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg><span class="sm-menu__label">Rename</span><span class="sm-menu__shortcut">F2</span></button>
      <button class="sm-menu__item" role="menuitem"><svg class="sm-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg><span class="sm-menu__label">Duplicate</span><span class="sm-menu__shortcut">Ctrl D</span></button>
      <button class="sm-menu__item" role="menuitemcheckbox" aria-checked="true"><svg class="sm-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span class="sm-menu__label">Favorite</span><svg class="sm-icon sm-menu__check" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg></button>
      <button class="sm-menu__item" role="menuitem" disabled><svg class="sm-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg><span class="sm-menu__label">Share</span></button>
      <hr class="sm-menu__sep">
      <button class="sm-menu__item sm-menu__item--danger" role="menuitem"><svg class="sm-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg><span class="sm-menu__label">Delete project</span></button>
    </div>
  </section>

  <div class="sm-menu sm-menu--floating" id="menu" role="menu" aria-label="Project actions" hidden>
    <button class="sm-menu__item" role="menuitem" tabindex="-1"><svg class="sm-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg><span class="sm-menu__label">Rename</span><span class="sm-menu__shortcut">F2</span></button>
    <button class="sm-menu__item" role="menuitem" tabindex="-1"><svg class="sm-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg><span class="sm-menu__label">Duplicate</span><span class="sm-menu__shortcut">Ctrl D</span></button>
    <button class="sm-menu__item" role="menuitem" tabindex="-1"><svg class="sm-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg><span class="sm-menu__label">Share</span></button>
    <hr class="sm-menu__sep">
    <button class="sm-menu__item sm-menu__item--danger" role="menuitem" tabindex="-1"><svg class="sm-icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg><span class="sm-menu__label">Delete project</span></button>
  </div>
  <p id="out" aria-live="polite">No action chosen.</p>
</main>
<script>
(function () {
  var area = document.getElementById('area');
  var menu = document.getElementById('menu');
  var out = document.getElementById('out');
  var items = Array.prototype.slice.call(menu.querySelectorAll('[role=menuitem]'));
  var returnTo = null, buffer = '', bufferTimer = 0, pressTimer = 0;

  function openAt(x, y) {
    returnTo = document.activeElement;
    menu.hidden = false;
    // Keep inside the viewport: flip left/up when there is no room.
    var w = menu.offsetWidth, h = menu.offsetHeight, m = 8;
    menu.style.left = Math.max(m, Math.min(x, innerWidth - w - m)) + 'px';
    menu.style.top = Math.max(m, Math.min(y, innerHeight - h - m)) + 'px';
    focusItem(0);
  }
  function close(restore) {
    if (menu.hidden) return;
    menu.hidden = true;
    if (restore && returnTo && returnTo.focus) returnTo.focus();
  }
  function enabled() { return items.filter(function (i) { return !i.disabled; }); }
  function focusItem(n) {
    var list = enabled(); if (!list.length) return;
    n = (n + list.length) % list.length;
    list.forEach(function (i, j) { i.tabIndex = j === n ? 0 : -1; });
    list[n].focus();
  }

  area.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    if (e.clientX === 0 && e.clientY === 0) { var r = area.getBoundingClientRect(); openAt(r.left + 24, r.top + 24); }  // keyboard-invoked
    else openAt(e.clientX, e.clientY);
  });
  // Long press on touch (550ms) opens the same menu.
  area.addEventListener('touchstart', function (e) { var t = e.touches[0]; pressTimer = setTimeout(function () { openAt(t.clientX, t.clientY); }, 550); }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(function (n) { area.addEventListener(n, function () { clearTimeout(pressTimer); }); });

  menu.addEventListener('click', function (e) {
    var b = e.target.closest('[role=menuitem]');
    if (!b || b.disabled) return;
    out.textContent = 'Chose: ' + b.querySelector('.sm-menu__label').textContent;
    close(true);
  });
  menu.addEventListener('keydown', function (e) {
    var list = enabled(), i = list.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); focusItem(i + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); focusItem(i - 1); }
    else if (e.key === 'Home') { e.preventDefault(); focusItem(0); }
    else if (e.key === 'End') { e.preventDefault(); focusItem(list.length - 1); }
    else if (e.key === 'Escape') { e.preventDefault(); close(true); }
    else if (e.key === 'Tab') { close(false); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {     // type-ahead
      buffer += e.key.toLowerCase(); clearTimeout(bufferTimer); bufferTimer = setTimeout(function () { buffer = ''; }, 600);
      var hit = list.findIndex(function (it) { return it.textContent.trim().toLowerCase().indexOf(buffer) === 0; });
      if (hit >= 0) focusItem(hit);
    }
  });
  document.addEventListener('mousedown', function (e) { if (!menu.hidden && !menu.contains(e.target)) close(false); });
  window.addEventListener('scroll', function () { close(false); }, true);
  window.addEventListener('resize', function () { close(false); });
})();
</script>
</body>
</html>
